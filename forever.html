<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculateur de talents — WoW Forever (démo)</title>
<script>
  /* thème choisi (partagé avec le reste du site) — appliqué avant le rendu */
  try{var t=localStorage.getItem('guide-theme');
    if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles/talents.css">
<style>
:root{
  --bg:#0C0D0B;--fg:#E7E4DA;--dim:#9AA09B;
  --hair:rgba(231,228,218,.14);
  --accent:#8FBDAE;--accent-soft:rgba(143,189,174,.14);
}
:root[data-theme="light"]{
  --bg:#F7F4EE;--fg:#20232A;--dim:#6C7178;
  --hair:rgba(30,34,42,.14);
  --accent:#3E6B5E;--accent-soft:rgba(62,107,94,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:'Hanken Grotesk',system-ui,sans-serif;
  line-height:1.45;min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
header{
  padding:34px 48px 26px;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;
  border-bottom:1px solid var(--hair);
}
header h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:29px;letter-spacing:-.01em}

.site-switch{display:flex;gap:18px;padding:14px 48px 0}
.site-switch a{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;opacity:.5;transition:opacity .15s}
.site-switch a:hover,.site-switch a.is-here{opacity:1}
.site-switch a.tbc{color:#62c907}
.site-switch a.forever{color:#1d8dcd}
@media(max-width:620px){.site-switch{padding:14px 24px 0}}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:40px 48px 60px}

footer{padding:16px 24px 18px;border-top:1px solid var(--hair);color:var(--dim);
  font-size:11.5px;letter-spacing:.02em;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.feedback{display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  color:#5865F2;font-size:14px;font-weight:600;letter-spacing:.01em;transition:color .18s}
.feedback:hover{color:#7B87FF}
.feedback svg{width:20px;height:20px;flex:none}

#themetoggle{position:fixed;right:24px;bottom:24px;z-index:98;
  font-family:'Hanken Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;
  color:var(--fg);background:transparent;border:1px solid var(--hair);
  padding:8px 14px;border-radius:999px;cursor:pointer;transition:border-color .2s}
#themetoggle:hover{border-color:var(--accent)}

@media(max-width:760px){
  header{padding:26px 24px 20px}
  main{padding:28px 24px 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="site-switch">
  <a href="tbc.html" class="tbc">TBC</a>
  <a href="forever.html" class="forever is-here">Forever</a>
</nav>

<header>
  <h1>Calculateur de talents</h1>
</header>

<main>
  <div id="talent-page"></div>
</main>

<footer>
  <a class="feedback" href="https://discord.gg/rz5PxxMgnv" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 15.885 3c-.213.386-.46.905-.63 1.319a18.27 18.27 0 0 0-5.51 0C9.575 3.905 9.322 3.386 9.11 3a19.7 19.7 0 0 0-4.432 1.369C1.869 8.59 1.106 12.705 1.488 16.76a19.9 19.9 0 0 0 6.073 3.08 14.6 14.6 0 0 0 1.307-2.136c-.72-.271-1.41-.606-2.06-1 .173-.128.342-.261.505-.398a14.2 14.2 0 0 0 12.171 0c.165.14.334.273.506.398-.652.394-1.343.73-2.064 1.001.377.75.815 1.463 1.307 2.135a19.85 19.85 0 0 0 6.076-3.08c.448-4.7-.766-8.777-3.209-12.39ZM8.02 14.331c-1.183 0-2.157-1.085-2.157-2.419s.955-2.418 2.157-2.418c1.21 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419Zm7.96 0c-1.183 0-2.157-1.085-2.157-2.419s.955-2.418 2.157-2.418c1.21 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419Z"/></svg>Pour signaler une erreur ou proposer une modification</a>
</footer>

<button id="themetoggle" type="button" aria-label="Basculer le thème clair ou sombre"></button>

<script>
(function(){
  var KEY='guide-theme', root=document.documentElement, btn=document.getElementById('themetoggle');
  function sync(){ btn.textContent=(root.dataset.theme==='light')?'Sombre':'Clair'; }
  btn.addEventListener('click',function(){
    var toLight=root.dataset.theme!=='light';
    root.dataset.theme=toLight?'light':'dark';
    try{localStorage.setItem(KEY,toLight?'light':'dark')}catch(e){}
    sync();
  });
  sync();
})();
</script>

<script src="data/talents-data.js"></script>
<script src="assets/talents-engine.js"></script>
<script src="assets/talents-ui.js"></script>

</body>
</html>
