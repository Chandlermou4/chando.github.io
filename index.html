<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chando</title>
<script>
  try{var t=localStorage.getItem('guide-theme');
    if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0D0B;--hair:rgba(231,228,218,.14)}
:root[data-theme="light"]{--bg:#F7F4EE;--hair:rgba(30,34,42,.14)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);display:flex;flex-direction:column}
.brand{display:block;width:min(420px,70vw);height:auto;margin:44px auto 0}
.choice-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.choice{display:flex;align-items:center;gap:28px;font-family:'Newsreader',Georgia,serif;font-weight:400;
  font-size:clamp(34px,6vw,64px)}
.choice a{display:flex;align-items:center;gap:14px;text-decoration:none;color:currentColor;opacity:.82;transition:opacity .2s}
.choice a:hover{opacity:1}
.choice a img{width:.78em;height:.78em;flex:none}
.choice .tbc{color:#62c907}
.choice .forever{color:#1d8dcd}
.choice .sep{color:var(--hair);font-size:.6em}
#themetoggle{position:fixed;right:24px;bottom:24px;z-index:98;
  font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;
  color:#9AA09B;background:transparent;border:1px solid var(--hair);
  padding:8px 14px;border-radius:999px;cursor:pointer}
:root[data-theme="light"] #themetoggle{color:#6C7178}
#themetoggle:hover{border-color:#8FBDAE}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<img class="brand" src="assets/media/logo-chando.webp" alt="Chando" width="900" height="450">

<div class="choice-wrap">
 <p class="choice">
   <a class="tbc" href="strats.html"><img src="assets/media/logo-tbc.png" alt="" width="48" height="48">TBC</a>
   <span class="sep">/</span>
   <a class="forever" href="talents.html"><img src="assets/media/logo-forever.png" alt="" width="48" height="48">Forever</a>
 </p>
</div>

<button id="themetoggle" type="button" aria-label="Basculer le thème clair ou sombre"></button>

<script>
(function(){
  var KEY='guide-theme', root=document.documentElement, btn=document.getElementById('themetoggle');
  function sync(){ btn.textContent=(root.dataset.theme==='light')?'Sombre':'Clair'; }
  btn.addEventListener('click',function(){
    var toLight=root.dataset.theme!=='light';
    root.dataset.theme=toLight?'light':'dark';
    try{localStorage.setItem(KEY,toLight?'light':'dark')}catch(e){}
    sync();
  });
  sync();
})();
</script>

</body>
</html>
